<!doctype html>
<html lang="th">
<head>
<title>เป้กไหม สำรับจั่ว</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=Kanit:wght@400;500;600;700&display=swap">
<style>
/* Layout: โต๊ะเกม ซ้าย = รายชื่อผู้เล่น (เรียงตามที่นั่ง) ขวา = กองไพ่ + ใบที่จั่ว บนมือถือแคบลงเหลือแต่ avatar */
:root {
  --bg: #F2EFE8;
  --surface: #FFFDF6;
  --fg: #1F1F1F;
  --muted: #5B5A55;
  --line: #D9D4C7;
  --accent: #8DB63C;
  --accent-ink: #1F2A06;
  --warn: #B3261E;
  --felt: #1E4D2B;
  --felt-hi: #2E6B3E;
  --font: 'Kanit', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17170F; --surface: #22221A; --fg: #F3F1E8; --muted: #AFAC9F; --line: #3A3A2E;
    --accent: #B9DA5A; --accent-ink: #1B2504; --warn: #FF8A80; --felt: #173A21; --felt-hi: #225230; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17170F; --surface: #22221A; --fg: #F3F1E8; --muted: #AFAC9F; --line: #3A3A2E;
  --accent: #B9DA5A; --accent-ink: #1B2504; --warn: #FF8A80; --felt: #173A21; --felt-hi: #225230; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
h1 { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.1; }
.chip { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; background: var(--surface); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--accent); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 150px; }
.field label { font-size: 13px; color: var(--muted); }
.field input { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--surface); min-width: 0; }
.btn { min-height: 44px; padding: 8px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 700; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
section.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
h2 { margin: 0; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* โต๊ะเกม */
.game { display: grid; grid-template-columns: minmax(170px, 240px) minmax(0, 1fr); gap: 16px; align-items: start; }
.players { padding: 12px; gap: 10px; }
.players h2 { font-size: 16px; }
.dir { font-size: 13px; color: var(--muted); }
.seats { display: flex; flex-direction: column; gap: 8px; }
.seat { position: relative; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--bg); min-width: 0; }
.avatar { position: relative; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; flex: none; }
.avatar .dot { position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border: 2px solid var(--bg); }
.seat .nm { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat.now { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.seat.now .nm { font-weight: 700; }
.seat.off { opacity: .55; }
.seat.me .nm::after { content: " (คุณ)"; color: var(--muted); font-weight: 400; }
.seat .tag { font-size: 11px; font-weight: 700; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 8px; flex: none; }
.seat .x { min-width: 28px; min-height: 28px; border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; border-radius: 50%; flex: none; }

.btn.small { min-height: 36px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.rulesbar { width: 100%; text-align: center; font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 10px; background: rgba(242,193,78,.18); border: 1px solid rgba(242,193,78,.5); color: #FFE9A8; }
.seat { flex-direction: column; align-items: stretch; gap: 6px; }
.srow { display: flex; align-items: center; gap: 10px; min-width: 0; position: relative; }
.cnts { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.cnt { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
.cnt .lab { color: var(--muted); }
.cnt b { min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; font-size: 15px; }
.cnt button { width: 26px; height: 26px; padding: 0; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.sch { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #1F1F1F; color: #fff; border: 0; }
.sch.hold { background: #2F7D32; cursor: default; }
button.sch.hold { cursor: pointer; }

.table {
  background: radial-gradient(ellipse at 50% 28%, var(--felt-hi), var(--felt) 70%);
  border: 1px solid rgba(0,0,0,.3); border-radius: 18px; padding: 16px; color: #F5F7EE;
  display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0;
}
.turn { width: 100%; text-align: center; font-size: 20px; font-weight: 700; padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.28); background: rgba(0,0,0,.28); }
.turn.mine { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.board { display: grid; grid-template-columns: minmax(70px, 26%) minmax(0, 1fr); gap: 16px; width: 100%; align-items: center; max-width: 560px; }
.pile { position: relative; aspect-ratio: 63 / 88; width: 100%; }
.pile .sheet { position: absolute; inset: 0; border-radius: 6%; background: #1F1F1F url(/cards/back.jpg) center / cover; box-shadow: 0 2px 8px rgba(0,0,0,.45); }
.pile .sheet:nth-child(1) { transform: translate(0, 0); }
.pile .sheet:nth-child(2) { transform: translate(4px, -4px); }
.pile .sheet:nth-child(3) { transform: translate(8px, -8px); }
.pile .cnt { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); font-weight: 700; font-size: 18px; background: rgba(0,0,0,.65); color: #fff; border-radius: 999px; padding: 2px 12px; z-index: 2; white-space: nowrap; }
.pile.empty .sheet { display: none; }
.pile.empty { border: 2px dashed rgba(255,255,255,.4); border-radius: 6%; }
.cardwrap { container-type: inline-size; width: 100%; max-width: 330px; justify-self: center; }
.who { font-size: 14px; color: rgba(255,255,255,.85); min-height: 21px; text-align: center; }
.draw { width: 100%; max-width: 360px; min-height: 60px; font-size: 22px; }
.status { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.table .chip { background: rgba(0,0,0,.28); color: #fff; border-color: rgba(255,255,255,.25); }

.pcard { position: relative; aspect-ratio: 63 / 88; border-radius: 5.1cqw; overflow: hidden; background: #F1E6C8; box-shadow: 0 2px 14px rgba(0,0,0,.35); }
.pcard img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.pcard.wide { background: #FCF1D5; }
.pcard.wide img { inset: auto; left: 0; top: 14.6cqw; height: auto; width: 100%; }
.pcard.pop { animation: pop .35s ease-out; }
@keyframes pop { from { transform: translateY(14px) scale(.96); opacity: .2; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pcard.pop { animation: none; } }
.p-top { position: absolute; left: 0; right: 0; top: 0; height: 27.3cqw; background: linear-gradient(#F3E8CD 45%, rgba(243,232,205,0)); }
.p-bot { position: absolute; left: 0; right: 0; bottom: 0; height: 47.6cqw; background: linear-gradient(rgba(243,232,205,0), #F3E8CD 42%); }
.p-stamp { position: absolute; left: 3.8cqw; top: 3.8cqw; width: 12.7cqw; height: 12.7cqw; border-radius: 50%; border: 1cqw solid var(--c); color: var(--c); display: flex; align-items: center; justify-content: center; font-size: 6cqw; font-weight: 700; transform: rotate(-8deg); background: rgba(243,232,205,.9); }
.p-title { position: absolute; left: 17.8cqw; right: 17.8cqw; top: 3.2cqw; text-align: center; font-family: 'Chonburi', 'Kanit', serif; line-height: 1.2; color: var(--c); white-space: nowrap; }
.p-line { position: absolute; left: 7cqw; right: 7cqw; bottom: 17.1cqw; text-align: center; font-weight: 600; line-height: 1.35; color: #2A2416; }
.p-foot { position: absolute; left: 3.8cqw; right: 3.8cqw; bottom: 3.8cqw; height: 9.5cqw; background: var(--c); color: #fff; border-radius: 2.5cqw; display: flex; justify-content: center; align-items: center; gap: 2.5cqw; font-size: 4.1cqw; font-weight: 600; }
.pip { width: 4.1cqw; height: 4.1cqw; border-radius: 50%; background: #B9DA5A; border: .6cqw solid #5E8C1F; display: inline-block; }
.pcard.gold .p-top { height: 0; }
.pcard.gold .p-stamp { display: none; }
.pcard.gold .p-title { left: 9.5cqw; right: 9.5cqw; top: 10.8cqw; color: #6E4E08; }
.pcard.gold .p-bot { bottom: 11.4cqw; height: 37.8cqw; }
.pcard.gold .p-line { left: 11.4cqw; right: 11.4cqw; bottom: 26.7cqw; }
.pcard.gold .p-foot { left: 10.8cqw; right: 10.8cqw; bottom: 13.3cqw; }

.hist { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.hist li { display: flex; align-items: center; gap: 10px; font-size: 15px; min-width: 0; }
.sw { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.hist .nm { font-weight: 500; }
.hist .by { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

details > summary { cursor: pointer; font-size: 18px; font-weight: 600; min-height: 44px; display: flex; align-items: center; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.quick span { font-size: 14px; color: var(--muted); }
.rows { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.rows li { display: grid; grid-template-columns: 14px 28px minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 4px 0; border-top: 1px solid var(--line); }
.rows li:first-child { border-top: 0; }
.rows .n { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rows .name { font-weight: 500; overflow-wrap: anywhere; }
.step { display: inline-flex; align-items: center; gap: 4px; }
.step button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 22px; line-height: 1; }
.step output { min-width: 28px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.note { font-size: 14px; color: var(--warn); margin: 0; }
.total { font-size: 15px; font-variant-numeric: tabular-nums; }

/* มือถือ: คอลัมน์ซ้ายเหลือ avatar + ชื่อสั้น ให้ไพ่ขวากว้างพอให้อ่านกติกา */
@media (max-width: 600px) {
  .game { grid-template-columns: 84px minmax(0, 1fr); gap: 8px; }
  .players { padding: 8px; }
  .players h2 { font-size: 13px; }
  .players h2 .chip, .dir { display: none; }
  .seat { text-align: center; gap: 4px; padding: 8px 4px; }
  .srow { flex-direction: column; gap: 4px; }
  .cnts { flex-direction: column; align-items: center; gap: 2px; }
  .cnt { flex-wrap: wrap; justify-content: center; font-size: 11px; gap: 2px; }
  .cnt button { width: 22px; height: 22px; font-size: 14px; }
  .cnt b { min-width: 14px; font-size: 13px; }
  .cnt .lab { width: 100%; text-align: center; }
  .chips { justify-content: center; }
  .sch { font-size: 10px; padding: 1px 6px; }
  .seat .nm { font-size: 12px; width: 100%; flex: none; text-align: center; }
  .seat.me .nm::after { content: ""; }
  .seat .tag { display: none; }
  .seat .x { position: absolute; top: -6px; right: -2px; }
  .table { padding: 10px; gap: 10px; }
  .turn { font-size: 16px; padding: 6px 8px; }
  .board { grid-template-columns: minmax(0, 1fr); }
  .pile { display: none; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>เป้กไหม · สำรับจั่ว</h1>
    <span class="chip" id="net"><span class="dot" id="netdot"></span><span id="nettxt">กำลังเชื่อมต่อ</span></span>
  </header>

  <section class="box" aria-label="ห้องและชื่อ">
    <div class="row">
      <div class="field"><label for="room">รหัสห้อง (ตัวอักษรอังกฤษ/ตัวเลข)</label><input id="room" maxlength="12" autocomplete="off" spellcheck="false"></div>
      <div class="field"><label for="who">ชื่อของคุณ</label><input id="who" maxlength="16" autocomplete="off" placeholder="เช่น โหน่ง"></div>
      <button class="btn" id="join" type="button" style="align-self:flex-end">เข้าห้อง</button>
    </div>
  </section>

  <div class="game">
    <aside class="box players" aria-label="ผู้เล่น">
      <h2><span>ผู้เล่น</span> <span class="chip" id="seatcount">0</span></h2>
      <div class="dir" id="dir"></div>
      <div class="seats" id="seats"></div>
      <button class="btn" id="skip" type="button" hidden>ข้ามตานี้</button>
      <button class="btn small" id="resetstats" type="button">ล้างตัวเลขดื่ม</button>
    </aside>

    <div class="table">
      <div class="turn" id="turn" aria-live="polite">รอเริ่มเกม</div>
      <div class="rulesbar" id="rulesbar" hidden></div>
      <div class="board">
        <div class="pile" id="pile" aria-hidden="true"><div class="sheet"></div><div class="sheet"></div><div class="sheet"></div><span class="cnt" id="pilecnt"></span></div>
        <div class="cardwrap" id="face"></div>
      </div>
      <div class="who" id="who-line" aria-live="polite"></div>
      <button class="btn primary draw" id="draw" type="button">จั่ว</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <section class="box">
    <h2>ใบที่เปิดไปแล้ว</h2>
    <ul class="hist" id="hist"></ul>
    <p class="empty" id="hist-empty">ยังไม่มีใครจั่ว</p>
  </section>

  <section class="box">
    <details id="cfg">
      <summary>ตั้งจำนวนใบของแต่ละแบบ</summary>
      <div style="display:flex;flex-direction:column;gap:12px;padding-top:8px">
        <div class="quick">
          <span>ตั้งทุกแบบ</span>
          <button class="btn" type="button" data-all="1">1 ใบ</button>
          <button class="btn" type="button" data-all="2">2 ใบ</button>
          <button class="btn" type="button" data-all="3">3 ใบ</button>
          <button class="btn" type="button" data-all="def">ค่าเริ่มต้น</button>
        </div>
        <ul class="rows" id="rows"></ul>
        <div class="row" style="justify-content:space-between">
          <span class="total" id="total"></span>
          <button class="btn primary" id="shuffle" type="button">สับสำรับใหม่</button>
        </div>
        <p class="note" id="stale" hidden>จำนวนที่แก้ยังไม่ถูกใช้ กด "สับสำรับใหม่" เพื่อเริ่มกองใหม่ ใบที่จั่วไปแล้วจะถูกล้าง</p>
      </div>
    </details>
  </section>
</main>

<script src="/app.js"></script>

</body>
</html>
